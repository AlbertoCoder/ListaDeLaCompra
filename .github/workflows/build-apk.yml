name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Fijado a 24.04 para no cambiar de versión de Ubuntu sin avisar
    # (ubuntu-latest pasa a Ubuntu 26 el 19/10/2026).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El runner ya incluye el Android SDK (ANDROID_HOME), así que no hace falta
      # la acción android-actions/setup-android.
      - name: Install SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # sdkmanager no siempre está en el PATH del runner: lo buscamos dentro del SDK
          SDKMANAGER=$(find "$ANDROID_HOME" -path '*cmdline-tools*' -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en $ANDROID_HOME"
            exit 1
          fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
