name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Fijado a 24.04 para no cambiar de versión de Ubuntu sin avisar
    # (ubuntu-latest pasa a Ubuntu 26 el 19/10/2026).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El runner ya incluye el Android SDK (ANDROID_HOME), así que no hace falta
      # la acción android-actions/setup-android.
      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
